<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 010</title>
  <desc>Rough black dry-media picture-book silhouette on near-white paper, with one decisive white feature cutout, sparse setting marks, and five-language documentation.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="30"/></clipPath>
    <pattern id="paper" width="29" height="25" patternUnits="userSpaceOnUse">
      <path d="M2 7L11 6M19 20L27 18M5 24L11 23" stroke="#171717" stroke-opacity=".045" stroke-width=".8"/>
      <circle cx="22" cy="7" r=".6" fill="#171717" fill-opacity=".055"/>
    </pattern>
    <pattern id="crayon" width="13" height="13" patternUnits="userSpaceOnUse">
      <path d="M-2 4L15 1M-2 9L15 6M1 14L16 10" stroke="#171717" stroke-width="4.2" stroke-linecap="round"/>
    </pattern>
    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .085" numOctaves="2" seed="10" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#F5F3EC"/>
    <rect width="1200" height="400" fill="url(#paper)"/>

    <path d="M704 318C768 312 826 313 882 320C940 327 1000 327 1074 317" stroke="#171717" stroke-width="8" stroke-linecap="round" stroke-opacity=".82" filter="url(#rough)"/>
    <path d="M846 305C820 271 819 220 835 174C852 125 889 97 930 101C974 105 1004 137 1014 181C1025 230 1005 280 970 307Z" fill="url(#crayon)" filter="url(#rough)"/>
    <path d="M873 174C888 149 915 138 939 146C960 153 972 173 967 194C962 217 939 230 914 225C888 220 866 198 873 174Z" fill="#F5F3EC" filter="url(#rough)"/>
    <circle cx="913" cy="184" r="5" fill="#171717"/>
    <path d="M935 198C943 201 949 200 955 196" stroke="#171717" stroke-width="3" stroke-linecap="round"/>
    <path d="M803 294L790 277M1037 304L1053 283M1081 311L1093 298" stroke="#171717" stroke-width="5" stroke-linecap="round" filter="url(#rough)"/>

    <text x="1048" y="116" text-anchor="middle" fill="#171717" font-family="Arial, sans-serif" font-size="11" letter-spacing="3">A SMALL STORY STAYS</text>
    <path d="M932 112H946" stroke="#171717" stroke-width="1.5"/>
    <text x="1160" y="38" text-anchor="end" fill="#171717" fill-opacity=".58" font-family="Arial, sans-serif" font-size="11" font-weight="700">中文 · EN · 日本語 · 한국어 ·</text>
    <text x="1160" y="55" text-anchor="end" direction="rtl" fill="#171717" fill-opacity=".58" font-family="Arial, sans-serif" font-size="11" font-weight="700">العربية</text>
  </g>

  <g transform="translate(64 54)">
    <text x="0" y="20" fill="#171717" font-family="Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2.4">🦁 XXD / IMAGE SKILL</text>
    <text x="0" y="111" fill="#171717" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="-4">PANEL 010</text>
    <text x="2" y="151" fill="#171717" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.05">ROUGH BLACK · CLEAN WHITE · ONE RELATION</text>
    <text x="2" y="193" fill="#171717" font-family="sans-serif" font-size="18" font-weight="700">粗黑干媒介童书剪影 · 黑粗，白净，形简</text>
    <text x="2" y="222" fill="#171717" fill-opacity=".7" font-family="sans-serif" font-size="14" font-weight="600">粗い黒の乾式画材による絵本 · 거친 검정 건식 재료 그림책</text>
    <text x="2" y="251" fill="#171717" fill-opacity=".7" font-family="Arial, sans-serif" font-size="14" font-weight="600">ظل خشن أسود بوسيط جاف على ورق أبيض</text>
  </g>

  <g transform="translate(64 327)">
    <rect width="153" height="37" rx="7" fill="#171717"/>
    <text x="76.5" y="24" text-anchor="middle" fill="#F5F3EC" font-family="Courier New, monospace" font-size="12" font-weight="900">SOURCE-BOUND</text>
    <rect x="165" width="102" height="37" rx="7" fill="#D9D5C8" stroke="#171717" stroke-width="2"/>
    <text x="216" y="24" text-anchor="middle" fill="#171717" font-family="Courier New, monospace" font-size="12" font-weight="900">4 MODES</text>
    <rect x="279" width="180" height="37" rx="7" fill="#F5F3EC" stroke="#171717" stroke-width="2"/>
    <text x="369" y="24" text-anchor="middle" fill="#171717" font-family="Courier New, monospace" font-size="12" font-weight="900">WALLPAPER PACK</text>
    <rect x="471" width="147" height="37" rx="7" fill="#D9D5C8" stroke="#171717" stroke-width="2"/>
    <text x="544.5" y="24" text-anchor="middle" fill="#171717" font-family="Courier New, monospace" font-size="12" font-weight="900">RASTER ONLY</text>
  </g>
</svg>
